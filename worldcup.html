<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Last Wicket Standing — World Cup 2027 — Anticiplay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --pitch-950:#0A0A0A;
    --pitch-900:#121212;
    --pitch-800:#241C14;
    --pitch-line:#4A3A2F;
    --chalk:#FFFFFF;
    --chalk-dim:#C4B7AE;
    --floodlight:#FFD700;
    --floodlight-dim:#B8960A;
    --brass:#22C55E;
    --danger:#E0796B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,215,0,0.08), transparent 60%),
      linear-gradient(180deg, var(--pitch-950), var(--pitch-900) 40%, var(--pitch-950));
    color:var(--chalk);
    font-family:'Inter Tight', Georgia, serif;
    font-weight:700;
    min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px;}
  h1{
    font-family:'Inter Tight',sans-serif;font-weight:700;font-size:clamp(26px,6vw,38px);
    letter-spacing:-0.01em;margin:8px 0 6px;text-transform:uppercase;
  }
  .sub{color:var(--chalk-dim);font-size:14px;max-width:600px;line-height:1.5;margin-bottom:22px;}
  .powered{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border:1px solid var(--pitch-line);border-radius:10px;padding:22px 24px;margin-bottom:18px;
  }
  .card h3{font-family:'Inter Tight',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:15px;color:var(--floodlight);margin:0 0 14px;}
  .card h4{font-family:'Inter Tight',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:12px;color:var(--chalk);margin:16px 0 8px;}
  .note{color:var(--chalk-dim);font-size:13px;line-height:1.6;margin-top:6px;}
  table{width:100%;border-collapse:collapse;font-family:'Inter Tight',monospace;font-size:13px;}
  th{text-align:left;color:var(--chalk-dim);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--pitch-line);text-transform:uppercase;font-size:11px;letter-spacing:.05em;}
  td{padding:9px 6px;border-bottom:1px solid rgba(74,58,47,0.4);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-family:'Inter Tight',monospace;font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.04em;}
  .field input, .field select{
    background:var(--pitch-950);border:1px solid var(--pitch-line);border-radius:6px;
    color:var(--chalk);padding:10px 12px;font-family:'Inter Tight',serif;font-size:14px;width:100%;
  }
  .field input:focus, .field select:focus{outline:1px solid var(--floodlight);}
  .btn-primary{
    font-family:'Inter Tight',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-size:14px;
    background:var(--floodlight);color:var(--pitch-950);border:none;border-radius:6px;
    padding:13px 22px;cursor:pointer;grid-column:1/-1;margin-top:4px;width:100%;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-secondary{
    font-family:'Inter Tight',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-size:12px;
    background:none;color:var(--floodlight);border:1px solid var(--floodlight-dim);border-radius:6px;
    padding:8px 14px;cursor:pointer;
  }
  .status{display:inline-block;font-family:'Inter Tight',monospace;font-size:11px;text-transform:uppercase;padding:3px 9px;border-radius:4px;letter-spacing:.03em;}
  .status.alive{background:rgba(255,215,0,0.22);color:var(--chalk);}
  .status.out{background:rgba(224,121,107,0.2);color:var(--danger);}
  .status.champ{background:rgba(34,197,94,0.28);color:var(--chalk);}
  .lms-status-strip{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:18px;padding:14px 18px;background:var(--pitch-800);border-radius:10px;border:1px solid var(--pitch-line);}
  .lms-status-item{display:flex;flex-direction:column;gap:2px;}
  .lms-status-item .num{font-family:'Inter Tight',serif;font-size:22px;font-weight:700;color:var(--floodlight);}
  .lms-status-item .lbl{font-family:'Inter Tight',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim);}
  .team-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:2px solid var(--pitch-line);background:var(--pitch-800);cursor:pointer;position:relative;}
  .team-chip[data-tip]:hover::after{
    content:attr(data-tip);
    position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:8px;
    background:var(--pitch-950);border:1px solid var(--floodlight-dim);color:var(--floodlight);
    padding:5px 10px;border-radius:6px;font-family:'Inter Tight',monospace;font-size:11px;
    white-space:nowrap;z-index:20;box-shadow:0 4px 10px rgba(0,0,0,0.4);
  }
  .team-chip[data-tip]:hover::before{
    content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;
    border:5px solid transparent;border-top-color:var(--floodlight-dim);z-index:20;
  }
  .team-chip .crest{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;}
  .team-chip.selected{border-color:var(--floodlight);background:var(--pitch-900);}
  .team-chip.used{opacity:.35;cursor:not-allowed;pointer-events:none;filter:grayscale(1);}
  .team-name{font-family:'Inter Tight',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.02em;}
  .fixture-row{display:grid;grid-template-columns:38px 122px 22px 38px 1fr;align-items:center;column-gap:12px;font-family:'Inter Tight',sans-serif;font-size:13px;padding:10px 0;border-bottom:1px solid rgba(74,58,47,0.35);}
  .fixture-row:last-child{border-bottom:none;}
  .badge-box{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--pitch-950);border:1px solid var(--pitch-line);border-radius:6px;flex-shrink:0;}
  .badge-box img{max-width:80%;max-height:80%;object-fit:contain;display:block;}
  .vs{text-align:center;color:var(--chalk-dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  .admin-match-row{background:var(--pitch-800);border:1px solid var(--pitch-line);border-radius:8px;padding:14px;margin-bottom:12px;}
  .admin-match-row .teams-line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:12px;}
  .admin-match-row .team-side{display:flex;align-items:center;gap:8px;}
  .admin-match-row .team-side.right{justify-content:flex-end;}
  .admin-match-row .buttons-line{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .admin-match-row .win-btn{width:100%;text-align:center;padding:10px 8px;}
  .result-strip{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:linear-gradient(90deg, rgba(255,215,0,0.10), transparent);border:1px solid var(--floodlight-dim);border-radius:8px;padding:16px 20px;margin-top:8px;}
  .result-label{font-family:'Inter Tight',sans-serif;text-transform:uppercase;font-size:13px;color:var(--chalk-dim);letter-spacing:.03em;}
  .result-points{font-family:'Inter Tight',monospace;font-size:22px;font-weight:700;color:var(--floodlight);letter-spacing:.04em;}
  .code-pill{font-family:'Inter Tight',monospace;background:var(--pitch-950);border:1px solid var(--floodlight-dim);color:var(--floodlight);padding:3px 10px;border-radius:6px;font-size:13px;letter-spacing:.05em;}
  .link{color:var(--floodlight);text-decoration:none;}
  .link:hover{text-decoration:underline;}
  .win-btn{font-family:'Inter Tight',monospace;font-size:12px;font-weight:700;padding:8px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--pitch-line);background:var(--pitch-950);color:var(--chalk-dim);}
  .win-btn.active{background:rgba(255,215,0,0.22);color:var(--chalk);border-color:var(--floodlight);}
  .badge-pill{display:inline-block;font-family:'Inter Tight',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:12px;margin:0 6px 6px 0;background:var(--pitch-950);border:1px solid var(--floodlight-dim);color:var(--floodlight);}
  .badge-pill.dim{color:var(--chalk-dim);border-color:var(--pitch-line);}
  .phase-strip{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .phase-pill{font-family:'Inter Tight',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:6px 10px;border-radius:14px;border:1px solid var(--pitch-line);background:var(--pitch-950);color:var(--chalk-dim);}
  .phase-pill.done{background:var(--pitch-800);color:var(--chalk);}
  .phase-pill.current{background:var(--floodlight);color:var(--pitch-950);border-color:var(--floodlight);}
  nav.main-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px;border-bottom:1px solid var(--pitch-line);padding-bottom:12px;}
  nav.main-nav button{
    font-family:'Inter Tight',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-size:12px;
    background:none;border:1px solid var(--pitch-line);color:var(--chalk-dim);padding:8px 16px;border-radius:20px;cursor:pointer;
  }
  nav.main-nav button.active{background:var(--floodlight);color:var(--pitch-950);border-color:var(--floodlight);}
  .footer-links{text-align:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--pitch-line);font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
</style>
</head>

/* ---------- Circle-method round robin (handles odd counts with a bye) ---------- */
function roundRobin(ids){
  let arr = ids.slice();
  if(arr.length % 2 === 1) arr.push(null);
  const n = arr.length;
  const rounds = [];
  for(let r=0;r<n-1;r++){
    const matches = [];
    for(let i=0;i<n/2;i++){
      const a = arr[i], b = arr[n-1-i];
      if(a!=null && b!=null) matches.push([a,b]);
    }
    rounds.push(matches);
    arr = [arr[0]].concat([arr[n-1]]).concat(arr.slice(1, n-1));
  }
  return rounds;
}

const GROUP_A_ROUNDS = roundRobin(GROUP_A); // 5 rounds x 3 matches
const GROUP_B_ROUNDS = roundRobin(GROUP_B); // 5 rounds x 3 matches
/* Combined Round-2 "gameweeks": each of the 5 rounds has all 12 teams in
   action across 6 matches (3 from Group A + 3 from Group B) — 30 matches total. */
function groupFixturesForRound(r){ // r = 1..5
  return GROUP_A_ROUNDS[r-1].concat(GROUP_B_ROUNDS[r-1]);
}

/* ---------- Data access ---------- */
async function loadLeague(code){
  const { data, error } = await sb.from(TABLE).select('*').eq('code', code).maybeSingle();
  if(error || !data) return null;
  return data.data;
}
async function saveLeague(league){
  await sb.from(TABLE).upsert({ code: league.code, data: league, updated_at: new Date().toISOString() });
}
async function loadAllLeagues(){
  /* Previously chained .order('updated_at') onto the query itself — if that
     ever fails for any reason, Supabase can silently return an empty result
     instead of surfacing the error, making Site Admin look empty with no
     clue why. Fetch unordered and sort client-side instead, and keep the
     error message around so the UI can actually show it. */
  const { data, error } = await sb.from(TABLE).select('*');
  if(error){ state.siteAdminError = error.message || 'Could not load leagues.'; return []; }
  state.siteAdminError = null;
  const rows = (data||[]).slice().sort((a,b)=> new Date(b.updated_at||0) - new Date(a.updated_at||0));
  return rows.map(row => row.data);
}
async function deleteLeagueByCode(code){
  await sb.from(TABLE).delete().eq('code', code);
}
function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function leagueShareLink(code){
  return window.location.origin + window.location.pathname + '?code=' + code;

  catch(e){ alert('Couldn\'t copy automatically — here\'s the link:\n\n' + text); return; }

/* ============================================================
   GAME LOGIC — three stages before the knockouts:
   Rounds 1–5   Group Stage   (2 groups of 6, 30 matches)
   Rounds 6–12  Super 7       (7 qualifiers, single round-robin, 21 matches)
   Round 13     Semi-Finals   (1v4, 2v3)
   Round 14     Final
   ============================================================ */
function roundLabel(r){
  if(r>=1 && r<=5) return 'Group Stage — Round '+r;
  if(r>=6 && r<=12) return 'Super 7 — Round '+(r-5);
  if(r===13) return 'Semi-Finals';
  if(r===14) return 'Final';
  return 'Complete';
}

/* Group standings: wins only (no NRR — we don't have real match data,
   ties broken by original seed order, noted in the Rules tab). */
/* Each entered match result is stored as {winner, scoreA, scoreB} going forward.
   Older leagues (created before scores existed) stored a bare team id instead —
   these accessors handle both shapes so nothing needs a data migration. */
function matchWinnerOf(cell){
  if(cell==null) return null;
  return (typeof cell === 'object') ? cell.winner : cell;
}
function matchScoresOf(cell){
  if(cell==null || typeof cell !== 'object') return { scoreA:null, scoreB:null };
  return { scoreA: cell.scoreA!=null ? cell.scoreA : null, scoreB: cell.scoreB!=null ? cell.scoreB : null };
}
function withWinner(cell, winner){
  const prev = (cell && typeof cell==='object') ? cell : {};
  return { ...prev, winner };
}
function withScore(cell, side, value){
  const prev = (cell && typeof cell==='object') ? cell : (cell!=null ? { winner: cell } : {});
  return side==='A' ? { ...prev, scoreA: value } : { ...prev, scoreB: value };
}
function computeGroupWins(league, groupIds, groupRoundsArr, offset){
  const wins = {}; groupIds.forEach(id=>wins[id]=0);
  for(let r=1;r<=5;r++){
    const results = league.groupResults && league.groupResults[r];
    if(!results) return null;
    groupRoundsArr[r-1].forEach((m,i)=>{
      const w = matchWinnerOf(results[offset+i]);
      if(w!=null) wins[w]++;
    });
  }
  return wins;
}
function groupStageComplete(league){
  for(let r=1;r<=5;r++){
    const res = league.groupResults && league.groupResults[r];
    if(!res || res.length<6 || res.some(x=>matchWinnerOf(x)==null)) return false;
  }
  return true;
}
function computeSuper7(league){
  if(!groupStageComplete(league)) return null;
  const winsA = computeGroupWins(league, GROUP_A, GROUP_A_ROUNDS, 0);
  const winsB = computeGroupWins(league, GROUP_B, GROUP_B_ROUNDS, 3);
  const sA = GROUP_A.slice().sort((a,b)=> winsA[b]-winsA[a] || a-b);
  const sB = GROUP_B.slice().sort((a,b)=> winsB[b]-winsB[a] || a-b);
  const fourthA = sA[3], fourthB = sB[3];
  const bestFourth = winsB[fourthB] > winsA[fourthA] ? fourthB : fourthA;
  const teams = [sA[0],sA[1],sA[2], sB[0],sB[1],sB[2], bestFourth];
  return { teams, standA:sA, standB:sB, winsA, winsB, bestFourth };
}
function super7FixturesForRound(league, r){ // r = 6..12
  const s7 = computeSuper7(league);
  if(!s7) return null;
  const rounds = roundRobin(s7.teams); // 7 rounds x 3 matches
  return rounds[r-6];
}
function super7Complete(league){
  const s7 = computeSuper7(league);
  if(!s7) return false;
  for(let r=6;r<=12;r++){
    const res = league.super7Results && league.super7Results[r];
    if(!res || res.length<3 || res.some(x=>matchWinnerOf(x)==null)) return false;
  }
  return true;
}
function computeSuper7Standings(league){
  const s7 = computeSuper7(league);
  if(!s7 || !super7Complete(league)) return null;
  const wins = {}; s7.teams.forEach(id=>wins[id]=0);
  for(let r=6;r<=12;r++){
    const fx = super7FixturesForRound(league, r);
    const res = league.super7Results[r];
    fx.forEach((m,i)=>{ const w=matchWinnerOf(res[i]); if(w!=null) wins[w]++; });
  }
  const standings = s7.teams.slice().sort((a,b)=> wins[b]-wins[a] || a-b);
  return { standings, wins };
}
function semiPairs(league){
  const st = computeSuper7Standings(league);
  if(!st) return null;
  const [s1,s2,s3,s4] = st.standings;
  return [[s1,s4],[s2,s3]];
}
function semisComplete(league){
  const sw = league.semiWinners && league.semiWinners[13];
  return !!(sw && sw.length===2 && matchWinnerOf(sw[0])!=null && matchWinnerOf(sw[1])!=null);
}
function finalPair(league){
  if(!semisComplete(league)) return null;
  return league.semiWinners[13];
}
function finalComplete(league){
  return !!(league.finalResult && league.finalResult.winner!=null && league.finalResult.margin!=null);
}

/* Unified fixture lookup used by pick/admin screens */
function fixturesForRound(league, r){
  if(r>=1 && r<=5) return groupFixturesForRound(r);
  if(r>=6 && r<=12) return super7FixturesForRound(league, r);
  if(r===13){ const p = semiPairs(league); return p; }
  if(r===14){ const p = finalPair(league); return p ? [p] : null; }
  return null;
}
function roundResultsComplete(league, r){
  if(r>=1 && r<=5){ const res=league.groupResults&&league.groupResults[r]; return !!(res && res.length>=6 && res.every(x=>matchWinnerOf(x)!=null)); }
  if(r>=6 && r<=12){ const res=league.super7Results&&league.super7Results[r]; return !!(res && res.length>=3 && res.every(x=>matchWinnerOf(x)!=null)); }
  if(r===13) return semisComplete(league);
  if(r===14) return finalComplete(league);
  return false;
}
function currentOpenRound(league){
  for(let r=1;r<=14;r++){ if(!roundResultsComplete(league, r)) return r; }
  return 15;
}

/* ---------- Player standings: picks, eliminations, mulligan, badges ---------- */
function computePlayerStandings(league){
  return (league.players||[]).map(pl=>{
    let eliminatedAtRound = null;
    let mulliganUsed = false;
    const history = [];
    const usedGroup = {};    // teams used during rounds 1-5
    const usedSuper7 = {};   // teams used during rounds 6-12
    for(let r=1;r<=14;r++){
      const pick = league.picks && league.picks[r] && league.picks[r][pl.id];
      if(eliminatedAtRound!==null){
        if(pick!=null) history.push({round:r, teamId:pick, result:'—'});
        continue;
      }
      if(pick==null) continue;
      if(r<=5) usedGroup[pick]=(usedGroup[pick]||0)+1;
      else if(r<=12) usedSuper7[pick]=(usedSuper7[pick]||0)+1;

      let winnerForPick = null;
      if(r<=5){
        const res = league.groupResults && league.groupResults[r];
        if(!res || res.some(x=>matchWinnerOf(x)==null)){ history.push({round:r, teamId:pick, result:'Pending'}); continue; }
        const fx = groupFixturesForRound(r);
        const idx = fx.findIndex(([a,b])=>a===pick||b===pick);
        winnerForPick = matchWinnerOf(res[idx]);
      } else if(r<=12){
        const res = league.super7Results && league.super7Results[r];
        const fx = super7FixturesForRound(league, r);
        if(!fx){ history.push({round:r, teamId:pick, result:'Pending'}); continue; }
        const idx = fx.findIndex(([a,b])=>a===pick||b===pick);
        if(idx<0 || !res || matchWinnerOf(res[idx])==null){ history.push({round:r, teamId:pick, result:'Pending'}); continue; }
        winnerForPick = matchWinnerOf(res[idx]);
      } else if(r===13){
        const pairs = semiPairs(league);
        if(!pairs){ history.push({round:r, teamId:pick, result:'Pending'}); continue; }
        const sw = league.semiWinners && league.semiWinners[13];
        const idx = pairs.findIndex(([a,b])=>a===pick||b===pick);
        if(idx<0 || !sw || matchWinnerOf(sw[idx])==null){ history.push({round:r, teamId:pick, result:'Pending'}); continue; }
        winnerForPick = matchWinnerOf(sw[idx]);
      } else if(r===14){
        if(!finalComplete(league)){ history.push({round:r, teamId:pick, result:'Pending'}); continue; }
        winnerForPick = league.finalResult.winner;
      }
      const outcome = winnerForPick === pick;
      if(outcome){
        history.push({round:r, teamId:pick, result:'Win'});
      } else {
        if(r<=5 && !mulliganUsed){
          mulliganUsed = true;
          history.push({round:r, teamId:pick, result:'Loss (mulligan used)'});
        } else {
          history.push({round:r, teamId:pick, result:'Loss'});
          eliminatedAtRound = r;
        }
      }
    }
    const finalPick = league.picks && league.picks[14] && league.picks[14][pl.id];
    const championEligible = eliminatedAtRound===null && finalComplete(league) && finalPick!=null && finalPick===league.finalResult.winner;
    return {
      ...pl,
      alive: eliminatedAtRound===null,
      eliminatedAtRound, history, mulliganUsed, usedGroup, usedSuper7,
      survivedGroup: eliminatedAtRound===null || eliminatedAtRound>5,
      madeSuper7: (eliminatedAtRound===null || eliminatedAtRound>12) && groupStageComplete(league),
      intoSemis: (eliminatedAtRound===null || eliminatedAtRound>13) && super7Complete(league),
      championEligible
    };
  });
}
function computeChampion(league){
  if(!finalComplete(league)) return null;
  const standings = computePlayerStandings(league);
  const candidates = standings.filter(s=>s.championEligible);
  if(candidates.length===0) return { none:true };
  if(candidates.length===1) return { player: candidates[0], tiebreak:false };
  const guesses = league.tiebreak || {};
  const actual = league.finalResult.margin;
  let best = null, bestDiff = Infinity;
  candidates.forEach(c=>{
    const g = guesses[c.id];
    const diff = (g==null) ? Infinity : Math.abs(g-actual);
    if(best===null || diff < bestDiff){ bestDiff = diff; best = c; }
  });
  return { player: best, tiebreak:true, candidates };
}
function championLabel(champ){
  if(!champ) return null;
  if(champ.none) return 'No survivors this season';
  return champ.player.name + (champ.tiebreak ? ' (tiebreak)' : '');
}

async function archiveSeason(){
  const league = state.league;
  const champ = computeChampion(league);
  if(champ===null){ alert('This season is not complete yet.'); return; }

  if(!confirm('Archive Season '+(league.season||1)+' (Champion: '+label+') and start a new season? Picks and results will be reset — players, sponsors, prize and Hall of Fame stay.')) return;
  if(!league.hallOfFame) league.hallOfFame = [];
  league.hallOfFame.push({ season: league.season||1, champion: label, date: new Date().toISOString() });
  league.season = (league.season||1) + 1;
  league.picks = {};
  league.groupResults = {};

  league.semiWinners = {};
  league.finalResult = null;
  league.tiebreak = {};

  render();
}
function resizeImageFile(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function saveSponsorsAndPrize(){
  const league = state.league;
  const fileInput = document.getElementById('sponsorsInput');
  const prizeVal = document.getElementById('prizeInput').value;
  league.prizeText = prizeVal;
  if(fileInput.files && fileInput.files.length>0){
    const files = Array.from(fileInput.files).slice(0,6);
    const images = [];
    for(const f of files){ images.push(await resizeImageFile(f, 240)); }
    league.sponsors = images;
  }
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  render();
}
function eligibleTeamsForRound(league, me, r){
  const fx = fixturesForRound(league, r);
  if(!fx) return [];
  const playing = [...new Set(fx.flat())];
  if(r<=5){
    return playing.filter(id => !(me.usedGroup && me.usedGroup[id]));
  } else if(r<=12){
    return playing.filter(id => !(me.usedSuper7 && me.usedSuper7[id]));
  }
  return playing; // knockouts: no lock, only 2-4 teams anyway
}

    + '<div class="lms-status-item"><div class="num" style="font-size:14px;">'+(round<=14?roundLabel(round):'Complete')+'</div><div class="lbl">Current Stage</div></div>'
    + '</div>';
  const champ = computeChampion(league);
  if(champ && !champ.none){
    html += '<div class="result-strip"><div><div class="result-label">Season '+(league.season||1)+' Champion'+(champ.tiebreak?' (tiebreak)':'')+'</div><div class="result-points">'+esc(champ.player.name)+'</div></div></div>';
  }
  html += '</div>';

  html += renderSponsorsCard(league);

  if(!me){
    html += '<div class="card"><h3>Add Yourself</h3>' + renderJoinOrLoginForm() + '</div>';
  } else {
    html += renderPickCard(league, me, round);
  }

  html += '<div class="card"><h3>Leaderboard</h3><div style="overflow-x:auto;"><table><thead><tr><th>Player</th><th>Status</th><th>Badges</th></tr></thead><tbody>';
  standings.slice().sort((a,b)=>(b.alive-a.alive)||(b.eliminatedAtRound||999)-(a.eliminatedAtRound||999)).forEach(s=>{
    const isChamp = champ && !champ.none && champ.player.id===s.id;
    let statusHtml;
    if(isChamp) statusHtml = '<span class="status champ">Champion \uD83C\uDFC6</span>';
    else statusHtml = '<span class="status '+(s.alive?'alive':'out')+'">'+(s.alive?'Still In':'Out ('+roundLabel(s.eliminatedAtRound)+')')+'</span>';
    let badges = '';
    if(s.survivedGroup && groupStageComplete(league)) badges += '<span class="badge-pill">Survived the Groups</span>';
    if(s.madeSuper7) badges += '<span class="badge-pill">Made the Super 7</span>';
    if(s.intoSemis) badges += '<span class="badge-pill">Into the Semis</span>';
    if(s.mulliganUsed) badges += '<span class="badge-pill dim">Mulligan used</span>';
    if(!badges) badges = '<span class="note" style="margin:0;">—</span>';
    html += '<tr><td>'+esc(s.name)+'</td><td>'+statusHtml+'</td><td>'+badges+'</td></tr>';
  });
  html += '</tbody></table></div></div>';

  return html;
}

/* ---------- Identity: required email, remembered per device ----------
   Email is required at join (so results can eventually be emailed, and so a
   player can recover their picks on another device). The player's id is also
   cached in localStorage per league code, so returning to the same league on
   the same device/browser recognises them automatically — no re-entering
   anything unless localStorage was cleared or it's a different device. */
function storageKeyFor(code){ return 'lws_identity_'+code; }
function getStoredIdentity(code){
  try{ const raw = localStorage.getItem(storageKeyFor(code)); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function setStoredIdentity(code, id){
  try{ localStorage.setItem(storageKeyFor(code), JSON.stringify({id})); } catch(e){}
}
function restoreIdentity(league){
  if(state.identity || !league) return;
  const stored = getStoredIdentity(league.code);
  if(stored && (league.players||[]).some(p=>p.id===stored.id)){
    state.identity = stored;
  }
}
function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}
function renderJoinOrLoginForm(){
  if(state.showEmailLogin){
    return '<p class="note" style="margin-top:0;">Enter the email you joined with to get back to your picks on this device.</p>'
      + '<div class="form-grid"><div class="field full"><label>Your email</label><input type="email" id="loginEmail" placeholder="e.g. you@example.com"></div></div>'
      + '<button class="btn-primary" style="margin-top:14px;" onclick="loginWithEmail()">Find My Picks</button>'
      + '<p class="note" style="margin-top:10px;"><a class="link" href="#" onclick="state.showEmailLogin=false;render();return false;">New here? Join instead</a></p>';
  }
  return '<p class="note" style="margin-top:0;">Join this league with your name and email to start picking.</p>'
    + '<div class="form-grid"><div class="field full"><label>Your name</label><input type="text" id="addName" placeholder="e.g. Dave"></div>'
    + '<div class="field full"><label>Email</label><input type="email" id="addEmail" placeholder="e.g. you@example.com"></div></div>'
    + '<button class="btn-primary" style="margin-top:14px;" onclick="addMeAsPlayer()">Join</button>'
    + '<p class="note" style="margin-top:10px;"><a class="link" href="#" onclick="state.showEmailLogin=true;render();return false;">Already joined on another device? Log in with your email</a></p>';
}
async function loginWithEmail(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  if(!email){ alert('Enter your email.'); return; }
  const league = state.league;
  const match = (league.players||[]).find(p=>(p.email||'').toLowerCase()===email);
  if(!match){ alert('No player with that email in this league. Check the email, or join as a new player.'); return; }
  state.identity = { id: match.id };
  setStoredIdentity(state.code, match.id);
  state.showEmailLogin = false;
  state.tab = 'myleague';
  render();
}
async function addMeAsPlayer(){
  const name = document.getElementById('addName').value.trim();
  const email = document.getElementById('addEmail').value.trim();
  if(!name){ alert('Enter your name.'); return; }
  if(!email || !isValidEmail(email)){ alert('Enter a valid email address \u2014 it\'s how round confirmations will reach you, and how you can get back to your picks on another device.'); return; }
  const league = state.league;
  if((league.players||[]).some(p=>(p.email||'').toLowerCase()===email.toLowerCase())){
    alert('That email is already registered in this league. Use "Log in with your email" instead.');
    return;
  }
  const id = 'p_'+Date.now()+'_'+Math.floor(Math.random()*10000);
  league.players.push({ id, name, email });
  await saveLeague(league);
  state.identity = { id };
  setStoredIdentity(state.code, id);
  state.league = await loadLeague(state.code);
  state.tab = 'myleague';
  render();
}

function renderPickCard(league, me, round){
  if(!me.alive){
    return '<div class="card"><h3>Make Your Pick</h3><p class="note" style="margin-top:0;">You\'re out of this competition. Come back next tournament.</p></div>';
  }
  if(round>14){
    return '<div class="card"><h3>Make Your Pick</h3><p class="note" style="margin-top:0;">The tournament is complete — check the leaderboard for the result.</p></div>';
  }
  const alreadyPicked = league.picks[round] && league.picks[round][me.id];
  let html = '<div class="card"><h3>Make Your Pick — '+roundLabel(round)+'</h3>';
  if(alreadyPicked!=null){
    html += '<div class="result-strip"><div><div class="result-label">Locked In</div><div class="result-points">'+esc(team(alreadyPicked).name)+'</div></div></div>';
    html += '<p class="note">Picks can\'t be changed once locked in.</p></div>';
    return html;
  }
  const fx = fixturesForRound(league, round);
  if(!fx){
    html += '<p class="note" style="margin-top:0;">Waiting on the previous stage to be settled before this round\'s fixtures are known.</p></div>';
    return html;
  }
  html += '<p class="note" style="margin-top:0;">Fixtures this round: '+fx.map(([a,b])=>team(a).short+' v '+team(b).short).join(', ')+'</p>';
  if(round<=5 && !me.mulliganUsed){
    html += '<p class="note">Group Stage: you have one mulligan — your first wrong pick this stage won\'t eliminate you.</p>';
  }
  if(round<=5){
    html += '<p class="note">Team lock: you can\'t pick the same team twice during the Group Stage.</p>';
  } else if(round<=12){
    html += '<p class="note">Team lock reset for the Super 7 — you can\'t repeat a team within this stage.</p>';
  }
  const options = eligibleTeamsForRound(league, me, round).map(id=>team(id));
  html += '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;">';
  options.forEach(t=>{
    const staged = state.selectedTeam===t.id;
    const match = fx.find(([a,b])=>a===t.id||b===t.id);
    const oppId = match ? (match[0]===t.id ? match[1] : match[0]) : null;
    const tip = oppId!=null ? (t.short+' v '+team(oppId).short) : '';
    html += '<div class="team-chip'+(staged?' selected':'')+'" data-tip="'+esc(tip)+'" onclick="selectTeam('+t.id+')">'+kitSVG(t.id)+'<span class="team-name">'+esc(t.name)+'</span></div>';
  });
  html += '</div>';
  if(round===14){
    html += '<div class="form-grid" style="margin-top:16px;"><div class="field full"><label>Tiebreak: guess the margin of victory (runs or wickets)</label>'
      + '<input type="number" id="tiebreakInput" placeholder="e.g. 34" value="'+esc(state.tiebreakGuess||'')+'" oninput="state.tiebreakGuess=this.value;"></div></div>'
      + '<p class="note">If more than one survivor correctly picks the Final winner, closest guess wins the title.</p>';
  }
  const canLock = state.selectedTeam!=null;
  html += '<button class="btn-primary" style="margin-top:16px;'+(canLock?'':'opacity:.4;cursor:not-allowed;')+'" '+(canLock?'onclick="lockPick()"':'disabled')+'>LOCK IN'+(canLock?': '+esc(team(state.selectedTeam).short).toUpperCase():'')+'</button>';
  html += '</div>';
  return html;
}
function selectTeam(id){ state.selectedTeam = id; render(); }
async function lockPick(){
  if(state.selectedTeam==null) return;
  const league = state.league;
  const round = currentOpenRound(league);
  if(!league.picks[round]) league.picks[round] = {};
  league.picks[round][state.identity.id] = state.selectedTeam;
  if(round===14){
    if(!league.tiebreak) league.tiebreak = {};
    const g = parseFloat(state.tiebreakGuess);
    if(!isNaN(g)) league.tiebreak[state.identity.id] = g;
  }
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  state.selectedTeam = null; state.tiebreakGuess = '';
  render();
}

}
function backToSiteAdminList(){
  state.siteAdminView = 'list'; state.code = null; state.league = null; state.adminUnlocked = false;
  state.allLeagues = null;
  render();
}
async function deleteLeagueFromSiteAdmin(code, name){
  if(!confirm('Permanently delete "'+name+'" ('+code+')? This cannot be undone.')) return;
  await deleteLeagueByCode(code);
  state.allLeagues = await loadAllLeagues();
  render();
}

/* ---------- Admin: enter results ---------- */
function adminMatchRowHTML(a, b, cell, onClickA, onClickB, onScoreA, onScoreB){
  const curWinner = matchWinnerOf(cell);
  const sc = matchScoresOf(cell);
  return '<div class="admin-match-row">'
    + '<div class="teams-line">'
    +   '<div class="team-side"><div class="badge-box">'+kitSVG(a)+'</div><span class="team-name">'+esc(team(a).short)+'</span></div>'
    +   '<span class="vs">v</span>'
    +   '<div class="team-side right"><span class="team-name">'+esc(team(b).short)+'</span><div class="badge-box">'+kitSVG(b)+'</div></div>'
    + '</div>'
    + '<div class="buttons-line" style="margin-bottom:10px;">'
    +   '<button class="win-btn'+(curWinner===a?' active':'')+'" onclick="'+onClickA+'">'+esc(team(a).short)+' won</button>'
    +   '<button class="win-btn'+(curWinner===b?' active':'')+'" onclick="'+onClickB+'">'+esc(team(b).short)+' won</button>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'
    +   '<div class="field"><label>'+esc(team(a).short)+' score</label><input type="text" value="'+esc(sc.scoreA||'')+'" placeholder="e.g. 187/6" onchange="'+onScoreA+'"></div>'
    +   '<div class="field"><label>'+esc(team(b).short)+' score</label><input type="text" value="'+esc(sc.scoreB||'')+'" placeholder="e.g. 165" onchange="'+onScoreB+'"></div>'
    + '</div>'
    + '</div>';
}
function renderAdmin(league, round){
  let html = '<div class="card"><h3>Admin — Enter Results</h3>';
  if(!state.adminUnlocked){
    html += '<div class="form-grid"><div class="field full"><label>Admin PIN</label><input type="text" id="adminPinInput" maxlength="4"></div></div>';
    html += '<button class="btn-secondary" style="margin-top:12px;" onclick="checkAdminPin()">Unlock Admin</button></div>';
    return html;
  }
  html += '<p style="margin:-8px 0 12px;"><a class="link" href="#" onclick="state.adminUnlocked=false;render();return false;">Log out of admin</a></p>';

  html += '<div style="border-top:1px solid var(--pitch-line);margin-bottom:16px;padding-top:14px;">'
    + '<label style="display:block;font-family:\'Inter Tight\',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--chalk-dim);margin-bottom:6px;">League Name</label>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
    +   '<input type="text" id="renameLeagueInput" value="'+esc(league.name)+'" style="flex:1;min-width:180px;">'
    +   '<button class="btn-secondary" id="renameLeagueBtn" onclick="renameLeague()">Save Name</button>'
    + '</div></div>';

  if(round>14){
    html += '<p class="note" style="margin-top:0;">Tournament complete.</p>';
  } else if(round<=5){
    const fx = groupFixturesForRound(round);
    if(!league.groupResults[round]) league.groupResults[round] = [null,null,null,null,null,null];
    html += '<p class="note" style="margin-top:0;">Enter the winner (and score, once you have it) of each Group Stage match in '+roundLabel(round)+'.</p>';
    fx.forEach(([a,b],i)=>{
      const cur = league.groupResults[round][i];
      html += adminMatchRowHTML(a, b, cur,
        "setGroupWinner("+round+","+i+","+a+")", "setGroupWinner("+round+","+i+","+b+")",
        "setGroupScore("+round+","+i+",'A',this.value)", "setGroupScore("+round+","+i+",'B',this.value)");
    });
    const allSet = league.groupResults[round].every(x=>matchWinnerOf(x)!=null);
    html += allSet
      ? '<p class="note" style="margin-top:16px;color:var(--floodlight);">\u2713 All results in \u2014 the next round is now open. No further action needed.</p>'
      : '<p class="note" style="margin-top:16px;">Enter all six winners to open the next round automatically \u2014 there\'s no separate step to advance it.</p>';
  } else if(round<=12){
    const fx = super7FixturesForRound(league, round);
    if(!fx){
      html += '<p class="note" style="margin-top:0;">Waiting on the Group Stage to finish before the Super 7 fixtures are known.</p>';
    } else {
      if(!league.super7Results[round]) league.super7Results[round] = [null,null,null];
      html += '<p class="note" style="margin-top:0;">Enter the winner (and score, once you have it) of each Super 7 match in '+roundLabel(round)+'.</p>';
      fx.forEach(([a,b],i)=>{
        const cur = league.super7Results[round][i];
        html += adminMatchRowHTML(a, b, cur,
          "setSuper7Winner("+round+","+i+","+a+")", "setSuper7Winner("+round+","+i+","+b+")",
          "setSuper7Score("+round+","+i+",'A',this.value)", "setSuper7Score("+round+","+i+",'B',this.value)");
      });
      const allSet = league.super7Results[round].every(x=>matchWinnerOf(x)!=null);
      html += allSet
        ? '<p class="note" style="margin-top:16px;color:var(--floodlight);">\u2713 All results in \u2014 the next round is now open. No further action needed.</p>'
        : '<p class="note" style="margin-top:16px;">Enter all three winners to open the next round automatically.</p>';
    }
  } else if(round===13){
    const pairs = semiPairs(league);
    if(!pairs){
      html += '<p class="note" style="margin-top:0;">Waiting on the Super 7 to finish before the semi-finals are known.</p>';
    } else {
      if(!league.semiWinners[13]) league.semiWinners[13] = [null,null];
      ['Semi-Final 1','Semi-Final 2'].forEach((label,i)=>{
        const [a,b] = pairs[i];
        const cur = league.semiWinners[13][i];
        html += '<p class="note" style="margin:14px 0 4px;color:var(--floodlight);text-transform:uppercase;font-size:12px;">'+label+'</p>';
        html += adminMatchRowHTML(a, b, cur,
          "setSemiWinner("+i+","+a+")", "setSemiWinner("+i+","+b+")",
          "setSemiScore("+i+",'A',this.value)", "setSemiScore("+i+",'B',this.value)");
      });
      const allSet = league.semiWinners[13].every(x=>matchWinnerOf(x)!=null);
      html += allSet
        ? '<p class="note" style="margin-top:16px;color:var(--floodlight);">\u2713 Both results in \u2014 the Final is now open. No further action needed.</p>'
        : '<p class="note" style="margin-top:16px;">Enter both winners to open the Final automatically.</p>';
    }
  } else if(round===14){
    const fp = finalPair(league);
    if(!fp){
      html += '<p class="note" style="margin-top:0;">Waiting on both semi-finals to be settled.</p>';
    } else {
      const fr = league.finalResult || {winner:null, margin:null};
      html += '<p class="note" style="margin-top:0;">Enter the Final winner, score, and winning margin (the margin is used for the sudden-death tiebreak if more than one player survives).</p>';
      html += adminMatchRowHTML(fp[0], fp[1], fr,
        "setFinalWinner("+fp[0]+")", "setFinalWinner("+fp[1]+")",
        "setFinalScore('A',this.value)", "setFinalScore('B',this.value)");
      html += '<div class="form-grid" style="margin-top:12px;"><div class="field full"><label>Winning margin (runs or wickets)</label>'
        + '<input type="number" id="finalMarginInput" value="'+(fr.margin!=null?fr.margin:'')+'" placeholder="e.g. 27" onchange="setFinalMargin(this.value)"></div></div>';
      html += finalComplete(league)
        ? '<p class="note" style="margin-top:16px;color:var(--floodlight);">\u2713 Winner and margin both in \u2014 the champion is crowned automatically. No further action needed.</p>'
        : '<p class="note" style="margin-top:16px;">Enter both the winner and the margin to crown the champion automatically.</p>';
    }
  }

  html += '<div style="border-top:1px solid var(--pitch-line);margin-top:20px;padding-top:16px;">';
  html += '<h3 style="margin-bottom:10px;">Sponsors &amp; Prize</h3>';
  html += '<p class="note" style="margin-top:0;">Shown to players on the Home tab. Uploading new sponsor logos replaces the current set (up to 6).</p>';
  if(league.sponsors && league.sponsors.length>0){
    html += '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;">';
    league.sponsors.forEach(src=>{
      html += '<img src="'+src+'" style="max-height:50px;max-width:120px;object-fit:contain;background:#fff;padding:4px;border-radius:6px;">';
    });
    html += '</div>';
  }
  html += '<div class="form-grid">'
    + '<div class="field full"><label>Sponsor logos (select up to 6)</label><input type="file" accept="image/*" id="sponsorsInput" multiple></div>'
    + '<div class="field full"><label>Prize description</label><textarea id="prizeInput" rows="3" style="width:100%;background:var(--pitch-950);border:1px solid var(--pitch-line);border-radius:6px;color:var(--chalk);padding:10px 12px;font-family:\'Inter Tight\',serif;font-size:14px;">'+esc(league.prizeText||'')+'</textarea></div>'
    + '</div>';
  html += '<button class="btn-secondary" style="margin-top:10px;" onclick="saveSponsorsAndPrize()">Save Sponsors &amp; Prize</button>';
  html += '</div>';
  html += '<div style="border-top:1px solid var(--pitch-line);margin-top:20px;padding-top:16px;">';
  html += '<h3 style="margin-bottom:10px;">Hall of Fame</h3>';
  html += '<p class="note" style="margin-top:0;">Currently Season '+(league.season||1)+'. Once the Final is settled, archive the season to crown the champion and start a fresh one with the same players.</p>';
  const champNow = computeChampion(league);
  const seasonDone = champNow !== null;
  html += '<button class="btn-secondary" style="margin-top:6px;'+(seasonDone?'':'opacity:.4;cursor:not-allowed;')+'" '+(seasonDone?'onclick="archiveSeason()"':'disabled')+'>Archive Season &amp; Start New Season</button>';
  html += '</div>';

  html += renderManagePlayers(league);
  html += renderDangerZone();
  html += '</div>';
  return html;
}
function renderManagePlayers(league){
  let html = '<div style="border-top:1px solid var(--pitch-line);margin-top:20px;padding-top:16px;">';
  html += '<h3 style="margin-bottom:10px;">Manage Players</h3>';
  if(!league.players || league.players.length===0){
    html += '<p class="note" style="margin-top:0;">No one has joined yet.</p>';
  } else {
    html += '<p class="note" style="margin-top:0;">Removing someone deletes their picks and history from this league — this can\'t be undone, so it\'s meant for cleaning up duplicates or test entries.</p>';
    html += '<div style="overflow-x:auto;"><table><thead><tr><th>Name</th><th>Email</th><th></th></tr></thead><tbody>';
    league.players.forEach(pl=>{
      html += '<tr><td>'+esc(pl.name)+'</td><td>'+(pl.email ? esc(pl.email) : '<span style="color:var(--chalk-dim);">—</span>')+'</td>'
        + '<td><button class="btn-secondary" style="padding:6px 12px;font-size:12px;border-color:var(--danger);color:var(--danger);" onclick="removePlayerFromLeague(\''+esc(pl.id)+'\',\''+esc(pl.name).replace(/'/g,"\\'")+'\')">Remove</button></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  return html;
}
async function removePlayerFromLeague(playerId, playerName){
  if(!confirm('Remove '+playerName+' from this league? Their picks and history will be deleted. This cannot be undone.')) return;
  const league = state.league;
  league.players = (league.players||[]).filter(p=>p.id!==playerId);
  if(league.picks){
    Object.keys(league.picks).forEach(r=>{ if(league.picks[r]) delete league.picks[r][playerId]; });
  }
  if(league.tiebreak){ delete league.tiebreak[playerId]; }
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  render();
}
function renderDangerZone(){
  return '<div style="border-top:1px solid var(--pitch-line);margin-top:20px;padding-top:16px;">'
    + '<h3 style="color:var(--danger);margin-bottom:10px;">Danger Zone</h3>'
    + '<button class="btn-secondary" style="border-color:var(--danger);color:var(--danger);" onclick="deleteLeague()">Delete This League</button>'
    + '</div>';
}
async function deleteLeague(){
  if(!confirm('Permanently delete "'+state.league.name+'"? This cannot be undone.')) return;
  await sb.from(TABLE).delete().eq('code', state.code);
  leaveLeague();
}
async function renameLeague(){
  const val = document.getElementById('renameLeagueInput').value.trim();
  if(!val){ alert('League name can\'t be empty.'); return; }
  state.league.name = val;
  await saveLeague(state.league);
  render();
}
function checkAdminPin(){
  const val = document.getElementById('adminPinInput').value.trim();
  if(val === state.league.adminPin){ state.adminUnlocked = true; render(); }
  else alert('Wrong PIN.');
}
async function setGroupWinner(round, matchIdx, teamId){
  const league = state.league;
  if(!league.groupResults[round]) league.groupResults[round] = [null,null,null,null,null,null];
  league.groupResults[round][matchIdx] = withWinner(league.groupResults[round][matchIdx], teamId);
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  render();
}
async function setGroupScore(round, matchIdx, side, value){
  const league = state.league;
  if(!league.groupResults[round]) league.groupResults[round] = [null,null,null,null,null,null];
  league.groupResults[round][matchIdx] = withScore(league.groupResults[round][matchIdx], side, value);
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  render();
}
async function setSuper7Winner(round, matchIdx, teamId){
  const league = state.league;
  if(!league.super7Results[round]) league.super7Results[round] = [null,null,null];
  league.super7Results[round][matchIdx] = withWinner(league.super7Results[round][matchIdx], teamId);
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  render();
}
async function setSuper7Score(round, matchIdx, side, value){
  const league = state.league;
  if(!league.super7Results[round]) league.super7Results[round] = [null,null,null];
  league.super7Results[round][matchIdx] = withScore(league.super7Results[round][matchIdx], side, value);
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  render();
}
async function setSemiWinner(pairIdx, teamId){
  const league = state.league;
  if(!league.semiWinners[13]) league.semiWinners[13] = [null,null];
  league.semiWinners[13][pairIdx] = withWinner(league.semiWinners[13][pairIdx], teamId);
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  render();
}
async function setSemiScore(pairIdx, side, value){
  const league = state.league;
  if(!league.semiWinners[13]) league.semiWinners[13] = [null,null];
  league.semiWinners[13][pairIdx] = withScore(league.semiWinners[13][pairIdx], side, value);
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  render();
}
async function setFinalWinner(teamId){
  const league = state.league;
  if(!league.finalResult) league.finalResult = {winner:null, margin:null, scoreA:null, scoreB:null};
  league.finalResult.winner = teamId;
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  render();
}
async function setFinalScore(side, value){
  const league = state.league;
  if(!league.finalResult) league.finalResult = {winner:null, margin:null, scoreA:null, scoreB:null};
  if(side==='A') league.finalResult.scoreA = value; else league.finalResult.scoreB = value;
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  render();
}
async function setFinalMargin(value){
  const league = state.league;
  if(!league.finalResult) league.finalResult = {winner:null, margin:null, scoreA:null, scoreB:null};
  const marginVal = parseFloat(value);
  league.finalResult.margin = isNaN(marginVal) ? null : marginVal;
  await saveLeague(league);
  state.league = await loadLeague(state.code);
  render();
}

render();
</script>
</body>
</html>
